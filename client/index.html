    <!-- Single Page Apps for GitHub Pages (https://github.com/rafgraph/spa-github-pages) -->
    <script type="text/javascript">
      (function(l) {
        // Handle ?/path format from 404.html
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');

          // Normalize trailing slash (kecuali root '/')
          if (decoded.length > 1 && decoded.endsWith('/')) {
            decoded = decoded.slice(0, -1);
          }

          var repoBase = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
          window.history.replaceState(null, null, repoBase + decoded + l.hash);
        }
        // Handle legacy ?redirect=path format jika tersisa dari sesi peramban lama
        else if (l.search.indexOf('redirect=') !== -1) {
          var match = l.search.match(/[?&]redirect=([^&]+)/);
          if (match && match[1]) {
            var target = decodeURIComponent(match[1]);
            if (target.length > 1 && target.endsWith('/')) {
              target = target.slice(0, -1);
            }
            var clean = target.startsWith('/') ? target : '/' + target;
            var repo = '/eportfolio-ppg-irvan';
            window.history.replaceState(null, null, repo + clean + l.hash);
          }
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
